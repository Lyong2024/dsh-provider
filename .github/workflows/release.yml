name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Require the tag to match package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "tag v${tag} does not match package.json version ${version}" >&2
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the package DSH loads
        run: pnpm run build

      - name: Run the offline contract and legacy suites
        run: |
          pnpm run test:matrix
          pnpm test

      - name: Pack the plugin tarball
        run: |
          version="$(node -p "require('./package.json').version")"
          pnpm pack --pack-destination "$RUNNER_TEMP/plugin-pack"
          packed="$RUNNER_TEMP/plugin-pack/dsh-provider-${version}.tgz"
          test -f "$packed"
          if ! tar -tzf "$packed" | grep -qx "package/dist/client.js"; then
            echo "tarball is missing package/dist/client.js" >&2
            exit 1
          fi
          if ! tar -tzf "$packed" | grep -qx "package/dist/index.js"; then
            echo "tarball is missing package/dist/index.js" >&2
            exit 1
          fi
          if ! tar -tzf "$packed" | grep -qx "package/cordis.patch.yml"; then
            echo "tarball is missing package/cordis.patch.yml" >&2
            exit 1
          fi
          client="$(mktemp)"
          tar -xOf "$packed" package/dist/client.js > "$client"
          if grep -Eq '^[[:space:]]*(import([[:space:]]|[{.(])|export([[:space:]]|[{]))' "$client"; then
            echo "package/dist/client.js is not a classic script" >&2
            exit 1
          fi
          if ! grep -q 'window.__ModuleLoader__.load' "$client"; then
            echo "package/dist/client.js does not call __ModuleLoader__.load" >&2
            exit 1
          fi
          cp "$packed" "$RUNNER_TEMP/plugin-pack/dsh-provider.tgz"
          (
            cd "$RUNNER_TEMP/plugin-pack"
            sha256sum "dsh-provider-${version}.tgz" "dsh-provider.tgz" > SHA256SUMS.txt
          )

      - name: Publish the GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p "require('./package.json').version")"
          notes="$RUNNER_TEMP/release-notes.md"
          url="${{ github.server_url }}/${{ github.repository }}/releases/download/v${version}/dsh-provider-${version}.tgz"
          {
            echo "Install from the pinned release asset:"
            echo
            echo '```sh'
            echo "dsh plugin --profile web add ${url}"
            echo '```'
            echo
            echo "The marketplace entry in awesome-dsh-plugin must point at that exact URL. This workflow does not edit that catalog."
          } > "$notes"
          if gh release view "v${version}" >/dev/null 2>&1; then
            gh release upload "v${version}" \
              "$RUNNER_TEMP/plugin-pack/dsh-provider-${version}.tgz" \
              "$RUNNER_TEMP/plugin-pack/dsh-provider.tgz" \
              "$RUNNER_TEMP/plugin-pack/SHA256SUMS.txt" \
              --clobber
          else
            gh release create "v${version}" \
              --title "v${version}" \
              --notes-file "$notes" \
              "$RUNNER_TEMP/plugin-pack/dsh-provider-${version}.tgz" \
              "$RUNNER_TEMP/plugin-pack/dsh-provider.tgz" \
              "$RUNNER_TEMP/plugin-pack/SHA256SUMS.txt"
          fi
